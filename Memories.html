<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="css/fullPage-3.1.2.min.css">
    <link rel="stylesheet" href="css/memories.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>
<audio src="music/3.mp3" loop data-bgm></audio>
<div class="bgcolor">
    <div style="z-index:100;" id="dowebok">
        <!--第一屏-->
        <div class="section">
            <div class="ly-box01">
                <div class="ly-head">
                    <span class="ly-head-diamond"></span>
                    <p class="ly-head-title">HAPPY BIRTHDAY</p>
                    <span class="ly-head-diamond"></span>
                </div>
                <div class="ly-txt01">
                    <p class="ly-stxt01">十月温柔的风</p>
                    <p class="ly-stxt02">落在你生日这天</p>
                    <p class="ly-stxt03">徐悦祝你岁岁心安</p>
                    <p class="ly-stxt04">沿路盛开的鲜花</p>
                    <p class="ly-stxt05">都来为你庆贺</p>
                </div>
                <div class="ly-txt02">
                    <p class="ly-stxt06">不必追赶世间匆忙</p>
                    <p class="ly-stxt07">往后的每一天</p>
                    <p class="ly-stxt08">轻松自在，少有烦恼</p>
                    <p class="ly-stxt09">热爱的事皆有回响</p>
                    <p class="ly-stxt10">长久拥有快乐与晴朗</p>
                </div>
            </div>
        </div>



    </div>
    <div class="float-deco">
        <i class="heart" style="--h:16px; left:8%; animation-duration:20s; animation-delay:0s;"></i>
        <i class="heart" style="--h:24px; left:22%; animation-duration:26s; animation-delay:6s;"></i>
        <i class="heart" style="--h:13px; left:40%; animation-duration:18s; animation-delay:11s;"></i>
        <i class="heart" style="--h:20px; left:56%; animation-duration:24s; animation-delay:3s;"></i>
        <i class="heart" style="--h:15px; left:72%; animation-duration:21s; animation-delay:9s;"></i>
        <i class="heart" style="--h:18px; left:88%; animation-duration:23s; animation-delay:14s;"></i>
    </div>
    <!--试验-->
    <ul class="bg-bubbles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</div>
<script src="js/jquery-3.6.0.min.js"></script>
<script src="js/bgm.js"></script>
<script src="js/fullPage-3.1.2.min.js"></script>
<script src="js/diy.js"></script>
</body>
</html>
